name: Build Capricorn AI APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'CapricornAI-APK-build-ready.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

          

      - name: Extraer proyecto
        run: |
          unzip -o CapricornAI-APK-build-ready.zip -d .

      - name: Compilar Capricorn AI
        run: gradle -p CapricornAI assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: CapricornAI-debug-apk
          path: CapricornAI/app/build/outputs/apk/debug/*.apk
